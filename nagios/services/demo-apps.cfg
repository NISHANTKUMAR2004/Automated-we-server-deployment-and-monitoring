define command {
    command_name    check_ams_demo_http
    command_line    /usr/lib/nagios/plugins/check_http -H '$HOSTADDRESS$' -I '$HOSTADDRESS$' -p 8080 -u '$ARG1$'
}

define service {
    use                     generic-service
    host_name               localhost
    service_description     APP - portfolio
    check_command           check_ams_demo_http!/portfolio/
    check_interval          1
    retry_interval          1
    max_check_attempts     1
}

