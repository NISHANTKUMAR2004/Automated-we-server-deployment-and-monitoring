server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /var/www/dummy-app;
    index index.html;

    location ~ ^/apps/(uploaded-[a-z0-9-]+)/?$ {
        root /var/www/ams-demo;
        try_files /$1/index.html =404;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /portfolio/ {
        alias /var/www/ams-demo/portfolio/;
        index index.html;
    }

    location /cloud-console/ {
        alias /var/www/ams-demo/cloud-console/;
        index index.html;
    }

    location /storefront/ {
        alias /var/www/ams-demo/storefront/;
        index index.html;
    }

    location /custom-demo/ {
        alias /var/www/ams-demo/custom-demo/;
        index index.html;
    }

    location /habit-tracker/ {
        alias /var/www/ams-demo/habit-tracker/;
        index index.html;
    }

    location /quiz-game/ {
        alias /var/www/ams-demo/quiz-game/;
        index index.html;
    }

    location /mini-calculator/ {
        alias /var/www/ams-demo/mini-calculator/;
        index index.html;
    }

    location /launch-timer/ {
        alias /var/www/ams-demo/launch-timer/;
        index index.html;
    }
}
