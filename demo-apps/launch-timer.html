<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launch Timer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #100d25; color: #fff7ec; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 22px; }
    main { width: min(100%, 580px); padding: 34px; border: 1px solid #473763; border-radius: 22px; background: radial-gradient(circle at 85% 10%, #573681, transparent 38%), #211934; text-align: center; box-shadow: 0 24px 70px #08051399; }
    .eyebrow { color: #d3a9ff; font-size: 12px; font-weight: 800; letter-spacing: 2px; }
    h1 { margin: 12px 0 6px; font-size: 36px; }
    p { color: #c0b4d3; }
    #time { margin: 26px 0; color: #f2d5a5; font-variant-numeric: tabular-nums; font-size: clamp(42px, 12vw, 72px); font-weight: 800; letter-spacing: 3px; }
    .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
    input { width: 110px; padding: 12px; border: 1px solid #5b4975; border-radius: 10px; color: white; background: #171126; font: inherit; }
    button { padding: 12px 17px; border: 0; border-radius: 10px; color: #25173a; background: #d7b4ff; font: inherit; font-weight: 800; cursor: pointer; }
    button.secondary { color: #eadcff; background: #49365e; }
    #status { min-height: 24px; margin-top: 17px; color: #d5c9e6; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">DEPLOY · COUNT DOWN · CELEBRATE</div>
    <h1>Launch Timer</h1>
    <p>Set a short countdown and start your demo launch.</p>
    <div id="time" aria-live="polite">00:10</div>
    <div class="controls">
      <input id="seconds" type="number" min="1" max="5999" value="10" aria-label="Countdown seconds">
      <button id="start" type="button">Start</button>
      <button id="reset" class="secondary" type="button">Reset</button>
    </div>
    <div id="status">Ready when you are.</div>
  </main>
  <script>
    const input = document.getElementById('seconds');
    const time = document.getElementById('time');
    const status = document.getElementById('status');
    let remaining = 10;
    let timer = null;
    function render() {
      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;
      time.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }
    document.getElementById('start').addEventListener('click', () => {
      if (timer) { window.clearInterval(timer); timer = null; }
      remaining = Math.min(5999, Math.max(1, Number(input.value) || 10));
      status.textContent = 'Countdown running…';
      render();
      timer = window.setInterval(() => {
        remaining -= 1;
        render();
        if (remaining <= 0) {
          window.clearInterval(timer);
          timer = null;
          status.textContent = 'Launch! Your demo is live.';
        }
      }, 1000);
    });
    document.getElementById('reset').addEventListener('click', () => {
      if (timer) window.clearInterval(timer);
      timer = null;
      remaining = Math.min(5999, Math.max(1, Number(input.value) || 10));
      status.textContent = 'Ready when you are.';
      render();
    });
  </script>
</body>
</html>
