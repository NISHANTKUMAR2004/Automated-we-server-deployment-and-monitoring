<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f3f7f2; color: #23352a; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 22px; }
    main { width: min(100%, 560px); padding: 30px; border: 1px solid #dfe9df; border-radius: 20px; background: #fff; box-shadow: 0 18px 50px #19391a12; }
    .eyebrow { color: #278454; font-size: 12px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: 34px; letter-spacing: -1.2px; }
    p { margin: 0 0 22px; color: #6a7c6f; }
    .progress { height: 9px; margin: 12px 0 20px; overflow: hidden; border-radius: 9px; background: #edf2eb; }
    .progress span { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #39b879, #9bdc75); transition: width .2s; }
    .habit { display: flex; align-items: center; gap: 12px; padding: 14px; margin: 9px 0; border: 1px solid #e8eee7; border-radius: 12px; cursor: pointer; }
    .habit input { width: 18px; height: 18px; accent-color: #28a263; }
    .habit span { flex: 1; font-weight: 650; }
    .habit input:checked + span { color: #849288; text-decoration: line-through; }
    button { padding: 10px 14px; border: 0; border-radius: 9px; color: white; background: #258751; font: inherit; font-weight: 700; cursor: pointer; }
    #progress-label { margin-bottom: 14px; color: #647568; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Daily momentum</div>
    <h1>Small habits, big wins.</h1>
    <p>Tick a habit and watch today's progress update.</p>
    <div id="progress-label">0 of 4 completed</div>
    <div class="progress"><span id="progress-bar"></span></div>
    <label class="habit"><input type="checkbox"><span>Drink a glass of water</span><b>💧</b></label>
    <label class="habit"><input type="checkbox"><span>Take a short walk</span><b>🚶</b></label>
    <label class="habit"><input type="checkbox"><span>Read for ten minutes</span><b>📖</b></label>
    <label class="habit"><input type="checkbox"><span>Write one good thing</span><b>✨</b></label>
    <button id="reset" type="button">Reset today's progress</button>
  </main>
  <script>
    const checks = [...document.querySelectorAll('.habit input')];
    const label = document.getElementById('progress-label');
    const bar = document.getElementById('progress-bar');
    const update = () => {
      const done = checks.filter((check) => check.checked).length;
      label.textContent = `${done} of ${checks.length} completed`;
      bar.style.width = `${done / checks.length * 100}%`;
    };
    checks.forEach((check) => check.addEventListener('change', update));
    document.getElementById('reset').addEventListener('click', () => {
      checks.forEach((check) => { check.checked = false; });
      update();
    });
  </script>
</body>
</html>
